[project]
name = "love_with_you"
version = "0.5.1"
dependencies = []

# Editor-only: resolve the N.E.K.O SDK (`plugin.sdk.plugin`) from the sibling
# host checkout during local development. Has no effect on packaging or runtime.
[tool.pyright]
extraPaths = ["../N.E.K.O"]

[tool.pytest.ini_options]
# The standalone source folder is not importable as a top-level Python package.
# Keep the release CLI's plain `pytest tests` collection inside tests/.
addopts = "--rootdir=tests --confcutdir=tests --import-mode=importlib -p no:cacheprovider --basetemp=../.pytest-love-with-you"

# Keep local pytest temp output (created on Windows when TEMP is unusable)
# out of the installable package.
[tool.neko.build]
exclude_dirs = ["pytest-of-*", ".benchmarks", "tools"]
