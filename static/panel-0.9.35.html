<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>:root {
  color-scheme: light dark;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --bg: #f7f9fc;
  --surface: rgba(255, 255, 255, 0.84);
  --surface-strong: rgba(255, 255, 255, 0.96);
  --text: #1f2937;
  --muted: #667085;
  --border: rgba(148, 163, 184, 0.36);
  --primary: #409eff;
  --success: #67c23a;
  --warning: #e6a23c;
  --danger: #f56c6c;
  --info: #14b8a6;
  --shadow-soft: 0 12px 36px rgba(15, 23, 42, 0.12);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f172a;
    --surface: rgba(15, 23, 42, 0.78);
    --surface-strong: rgba(17, 24, 39, 0.94);
    --text: #e5e7eb;
    --muted: #94a3b8;
    --border: rgba(148, 163, 184, 0.22);
    --shadow-soft: 0 18px 48px rgba(0, 0, 0, 0.22);
  }
}

* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
}

.neko-page { padding: 18px; display: grid; gap: 14px; animation: neko-fade-up 240ms ease both; }
.neko-page-title { margin: 0; font-size: 22px; font-weight: 760; }
.neko-page-subtitle { margin: 4px 0 0; color: var(--muted); line-height: 1.6; }
.neko-card {
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface);
  box-shadow: none;
  overflow: hidden;
  animation: neko-fade-up 260ms ease both;
}
.neko-card-header { padding: 12px 14px 0; }
.neko-card-title { margin: 0; font-size: 15px; font-weight: 720; }
.neko-card-body { padding: 12px 14px 14px; display: grid; gap: 12px; }

.neko-section { display: grid; gap: 10px; }
.neko-heading { margin: 0; color: var(--text); font-weight: 760; line-height: 1.35; }
.neko-container {
  width: 100%;
  max-width: var(--container-max-width, 100%);
  margin-inline: auto;
  padding: var(--container-padding, 0);
}
.neko-stack { display: flex; flex-direction: column; gap: var(--stack-gap, 12px); }
.neko-inline {
  display: flex;
  flex-wrap: wrap;
  align-items: var(--inline-align, center);
  justify-content: var(--inline-justify, flex-start);
  gap: var(--inline-gap, 8px);
  min-width: 0;
}
.neko-inline[data-wrap="false"] { flex-wrap: nowrap; }
.neko-grid { display: grid; grid-template-columns: repeat(var(--grid-cols, 2), minmax(0, 1fr)); gap: var(--grid-gap, 12px); }
.neko-columns {
  display: grid;
  grid-template-columns: repeat(var(--columns-cols, 2), minmax(0, 1fr));
  gap: var(--columns-gap, 12px);
  min-width: 0;
}
.neko-columns.is-fluid {
  grid-template-columns: repeat(auto-fit, minmax(min(100%, var(--columns-min, 220px)), 1fr));
}
.neko-split {
  display: grid;
  grid-template-columns: var(--split-template, minmax(0, 1fr) minmax(0, 1fr));
  gap: var(--split-gap, 12px);
  align-items: var(--split-align, stretch);
  min-width: 0;
}
.neko-split[data-direction="vertical"] {
  grid-template-columns: 1fr;
  grid-template-rows: var(--split-template, auto auto);
}
.neko-scroll-area {
  height: var(--scroll-height, auto);
  max-height: var(--scroll-max-height, 360px);
  min-height: var(--scroll-min-height, 0);
  padding: var(--scroll-padding, 0);
  border-radius: var(--radius-md);
  overscroll-behavior: contain;
}
.neko-scroll-area[data-axis="x"] { overflow-x: auto; overflow-y: hidden; }
.neko-scroll-area[data-axis="y"] { overflow-x: hidden; overflow-y: auto; }
.neko-scroll-area[data-axis="both"] { overflow: auto; }
.neko-text { margin: 0; color: var(--muted); line-height: 1.7; }

.neko-button {
  border: 1px solid rgba(64,158,255,0.38);
  border-radius: 12px;
  padding: 8px 14px;
  background: rgba(64,158,255,0.12);
  color: var(--primary);
  font: inherit;
  font-weight: 650;
  cursor: pointer;
  transition: transform 140ms ease, background-color 140ms ease, box-shadow 140ms ease;
}
.neko-button:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(64,158,255,0.14); }
.neko-button[data-tone="danger"] { color: var(--danger); border-color: rgba(245,108,108,0.38); background: rgba(245,108,108,0.1); }
.neko-button[data-tone="success"] { color: var(--success); border-color: rgba(103,194,58,0.38); background: rgba(103,194,58,0.1); }
.neko-button:disabled { opacity: 0.55; cursor: wait; transform: none; }
.neko-button-group { display: flex; flex-wrap: wrap; gap: 8px; }

.neko-badge {
  display: inline-flex; align-items: center; gap: 6px;
  width: fit-content; padding: 4px 9px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface-strong);
  color: var(--muted); font-size: 12px; font-weight: 650;
}
.neko-badge::before { content: ""; width: 7px; height: 7px; border-radius: 999px; background: var(--primary); }
.neko-badge[data-tone="success"]::before { background: var(--success); }
.neko-badge[data-tone="warning"]::before { background: var(--warning); }
.neko-badge[data-tone="danger"]::before { background: var(--danger); }
.neko-badge[data-tone="info"]::before { background: var(--info); }

.neko-stat { display: grid; gap: 6px; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); }
.neko-stat-label { color: var(--muted); font-size: 12px; font-weight: 650; }
.neko-stat-value { color: var(--text); font-size: 24px; font-weight: 780; line-height: 1.1; }
.neko-status-strip {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 12px;
  padding: 9px 11px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
}
.neko-status-strip-main { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; min-width: 0; }
.neko-status-item {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 28px;
  padding: 3px 8px;
  border-right: 1px solid var(--border);
}
.neko-status-item:last-child { border-right: 0; }
.neko-status-item > span { color: var(--muted); font-size: 12px; white-space: nowrap; }
.neko-status-item > strong { color: var(--text); font-size: 13px; font-weight: 760; }
.neko-key-value { display: grid; gap: 8px; }
.neko-key-value-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.neko-key-value-key { color: var(--muted); }
.neko-key-value-value { color: var(--text); font-weight: 650; text-align: right; }
.neko-compact-kv .neko-key-value { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 14px; }
.neko-compact-kv .neko-key-value-row { padding: 4px 0; }
.neko-table { width: 100%; border-collapse: separate; border-spacing: 0; overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius-lg); }
.neko-table th, .neko-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
.neko-table th { color: var(--muted); font-size: 12px; background: rgba(148,163,184,0.08); }
.neko-table tr:last-child td { border-bottom: none; }
.neko-table tbody tr { transition: background-color 140ms ease; }
.neko-table tbody tr:hover { background: rgba(64,158,255,0.06); }
.neko-table tbody tr.is-selected { background: rgba(64,158,255,0.12); }

.neko-divider { height: 1px; background: var(--border); margin: 4px 0; }
.neko-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.neko-toolbar-group { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.neko-alert { border: 1px solid rgba(64,158,255,0.26); border-radius: var(--radius-lg); padding: 12px 14px; background: rgba(64,158,255,0.08); color: var(--text); line-height: 1.65; }
.neko-alert[data-tone="success"] { border-color: rgba(103,194,58,0.28); background: rgba(103,194,58,0.1); }
.neko-alert[data-tone="warning"] { border-color: rgba(230,162,60,0.32); background: rgba(230,162,60,0.11); }
.neko-alert[data-tone="danger"] { border-color: rgba(245,108,108,0.32); background: rgba(245,108,108,0.1); }
.neko-empty { display: grid; gap: 8px; place-items: center; padding: 26px; color: var(--muted); text-align: center; border: 1px dashed var(--border); border-radius: var(--radius-lg); }
.neko-empty-title { color: var(--text); font-weight: 720; }
.neko-modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 9990;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(15, 23, 42, 0.48);
}
.neko-modal {
  width: min(520px, 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  background: var(--surface-strong);
  box-shadow: var(--shadow-soft);
  overflow: hidden;
}
.neko-modal[data-size="sm"] { width: min(380px, 100%); }
.neko-modal[data-size="md"] { width: min(520px, 100%); }
.neko-modal[data-size="lg"] { width: min(760px, 100%); }
.neko-modal[data-size="xl"] { width: min(960px, 100%); }
.neko-modal[data-size="full"] { width: min(1120px, 96vw); max-height: 92vh; }
.neko-modal-header { padding: 16px 18px 0; }
.neko-modal-title { margin: 0; font-size: 17px; font-weight: 760; }
.neko-modal-body { padding: 16px 18px; max-height: min(72vh, 760px); overflow: auto; }
.neko-modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 0 18px 18px; }
.neko-modal:focus { outline: 2px solid rgba(64,158,255,0.34); outline-offset: -2px; }
.neko-toast-root {
  position: fixed;
  z-index: 10000;
  top: 16px;
  right: 16px;
  display: grid;
  gap: 8px;
  max-width: min(360px, calc(100vw - 32px));
}
.neko-toast {
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 10px 12px;
  background: var(--surface-strong);
  color: var(--text);
  box-shadow: var(--shadow-soft);
}
.neko-toast[data-tone="success"] { border-color: rgba(103,194,58,0.38); }
.neko-toast[data-tone="warning"] { border-color: rgba(230,162,60,0.42); }
.neko-toast[data-tone="danger"] { border-color: rgba(245,108,108,0.42); color: var(--danger); }
.neko-list { display: grid; gap: 8px; }
.neko-list-item { padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); }
.neko-progress { display: grid; gap: 6px; }
.neko-progress-track { height: 8px; border-radius: 999px; overflow: hidden; background: rgba(148,163,184,0.18); }
.neko-progress-bar { height: 100%; width: var(--progress, 0%); border-radius: inherit; background: var(--primary); transition: width 220ms ease; }
.neko-progress-label { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
.neko-progress.is-indeterminate .neko-progress-bar { width: 38%; animation: neko-progress-indeterminate 1.15s ease-in-out infinite; }

.neko-form { display: grid; gap: 12px; }
.neko-form-section {
  display: grid;
  gap: 10px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: rgba(148,163,184,0.06);
}
.neko-form-section-header { display: grid; gap: 4px; }
.neko-form-section-title { margin: 0; font-size: 14px; font-weight: 760; color: var(--text); }
.neko-form-section-description { margin: 0; color: var(--muted); line-height: 1.55; }
.neko-form-section-body { display: grid; gap: 12px; }
.neko-form-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
  padding-top: 4px;
}
.neko-form-actions.is-start { justify-content: flex-start; }
.neko-tooltip {
  position: relative;
  display: inline-flex;
  width: fit-content;
  min-width: 0;
}
.neko-tooltip:focus { outline: none; }
.neko-tooltip-content {
  position: absolute;
  z-index: 10000;
  left: 50%;
  bottom: calc(100% + 8px);
  max-width: min(280px, 80vw);
  padding: 7px 9px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface-strong);
  box-shadow: var(--shadow-soft);
  color: var(--text);
  font-size: 12px;
  line-height: 1.45;
  white-space: normal;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 4px);
  transition: opacity 120ms ease, transform 120ms ease;
}
.neko-tooltip[data-placement="bottom"] .neko-tooltip-content { top: calc(100% + 8px); bottom: auto; transform: translate(-50%, -4px); }
.neko-tooltip[data-placement="left"] .neko-tooltip-content { left: auto; right: calc(100% + 8px); bottom: 50%; transform: translate(4px, 50%); }
.neko-tooltip[data-placement="right"] .neko-tooltip-content { left: calc(100% + 8px); bottom: 50%; transform: translate(-4px, 50%); }
.neko-tooltip:hover .neko-tooltip-content,
.neko-tooltip:focus-within .neko-tooltip-content,
.neko-tooltip:focus .neko-tooltip-content {
  opacity: 1;
  transform: translate(-50%, 0);
}
.neko-tooltip[data-placement="left"]:hover .neko-tooltip-content,
.neko-tooltip[data-placement="left"]:focus-within .neko-tooltip-content,
.neko-tooltip[data-placement="left"]:focus .neko-tooltip-content { transform: translate(0, 50%); }
.neko-tooltip[data-placement="right"]:hover .neko-tooltip-content,
.neko-tooltip[data-placement="right"]:focus-within .neko-tooltip-content,
.neko-tooltip[data-placement="right"]:focus .neko-tooltip-content { transform: translate(0, 50%); }
.neko-field { display: grid; gap: 6px; }
.neko-field-label { color: var(--text); font-size: 13px; font-weight: 680; }
.neko-field-required { margin-left: 4px; color: var(--danger); }
.neko-field-help { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
.neko-field-error, .neko-action-error, .neko-action-success {
  margin: 0;
  font-size: 12px;
  line-height: 1.55;
}
.neko-field-error, .neko-action-error { color: var(--danger); }
.neko-action-success { color: var(--success); }
.neko-action-control { display: inline-grid; gap: 6px; align-items: start; }
.neko-input, .neko-select, .neko-textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 8px 10px;
  background: var(--surface-strong);
  color: var(--text);
  font: inherit;
  outline: none;
}
.neko-textarea { min-height: 84px; resize: vertical; }
.neko-input:focus, .neko-select:focus, .neko-textarea:focus {
  border-color: rgba(64,158,255,0.58);
  box-shadow: 0 0 0 3px rgba(64,158,255,0.12);
}
.neko-input[data-invalid="true"], .neko-select[data-invalid="true"], .neko-textarea[data-invalid="true"] {
  border-color: rgba(245,108,108,0.72);
  box-shadow: 0 0 0 3px rgba(245,108,108,0.12);
}
.neko-switch { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); }
.neko-checkbox { width: 16px; height: 16px; accent-color: var(--primary); }
.neko-checkbox-group, .neko-choice-group { display: grid; gap: 8px; }
.neko-choice { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.neko-choice-input { width: 16px; height: 16px; accent-color: var(--primary); }
.neko-choice-label { color: var(--text); }
.neko-slider { display: grid; grid-template-columns: minmax(0, 1fr) minmax(42px, auto); gap: 10px; align-items: center; }
.neko-slider-input { width: 100%; accent-color: var(--primary); }
.neko-slider-value { color: var(--muted); font-size: 12px; text-align: right; }
.neko-segmented {
  display: inline-flex;
  width: fit-content;
  max-width: 100%;
  padding: 3px;
  gap: 3px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: rgba(148,163,184,0.1);
}
.neko-segmented-button {
  border: 0;
  border-radius: calc(var(--radius-md) - 3px);
  padding: 6px 10px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  cursor: pointer;
  white-space: nowrap;
}
.neko-segmented-button.is-active {
  color: var(--primary);
  background: var(--surface-strong);
  box-shadow: 0 1px 3px rgba(15,23,42,0.08);
}
.neko-accordion {
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--surface);
  overflow: hidden;
}
.neko-accordion-trigger {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border: 0;
  padding: 11px 13px;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}
.neko-accordion-icon { color: var(--muted); font-weight: 760; }
.neko-accordion-body { display: grid; gap: 12px; padding: 0 13px 13px; }
.neko-markdown { color: var(--muted); line-height: 1.65; white-space: pre-wrap; }
.neko-image-upload {
  min-height: 220px;
  display: grid;
  place-items: center;
  gap: 8px;
  padding: 12px;
  border: 1px dashed var(--border);
  border-radius: var(--radius-lg);
  background: rgba(148,163,184,0.06);
  color: var(--muted);
  cursor: pointer;
  text-align: center;
}
.neko-image-upload.is-compact { min-height: 154px; padding: 10px; }
.neko-image-upload.is-dragging { border-color: rgba(64,158,255,0.7); background: rgba(64,158,255,0.08); }
.neko-file-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.neko-image-upload-preview {
  max-width: 100%;
  max-height: 420px;
  object-fit: contain;
  border-radius: var(--radius-md);
}
.neko-image-upload-placeholder { font-weight: 650; }
.neko-media-upload {
  min-height: 96px;
  display: grid;
  place-items: center;
  gap: 8px;
  padding: 12px;
  border: 1px dashed var(--border);
  border-radius: var(--radius-lg);
  background: rgba(148,163,184,0.06);
  color: var(--muted);
  cursor: pointer;
  text-align: center;
}
.neko-media-upload.is-dragging { border-color: rgba(64,158,255,0.7); background: rgba(64,158,255,0.08); }
.neko-image-preview {
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: rgba(148,163,184,0.06);
}
.neko-image-preview img {
  width: 100%;
  max-height: 520px;
  object-fit: contain;
  border-radius: var(--radius-md);
}
.neko-image-preview figcaption { color: var(--muted); font-size: 12px; text-align: center; }
.neko-media-player {
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: rgba(148,163,184,0.06);
}
.neko-media-player audio,
.neko-media-player video {
  width: 100%;
  max-height: 420px;
}
.neko-media-player figcaption { color: var(--muted); font-size: 12px; text-align: center; }
.neko-gallery {
  display: grid;
  grid-template-columns: repeat(var(--gallery-cols, 4), minmax(0, 1fr));
  gap: 10px;
}
.neko-gallery-item {
  min-width: 0;
  display: grid;
  gap: 6px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 8px;
  background: var(--surface);
  color: var(--text);
  font: inherit;
  cursor: pointer;
}
.neko-gallery-item img {
  width: 100%;
  aspect-ratio: 1 / 1;
  object-fit: contain;
  border-radius: calc(var(--radius-md) - 2px);
  background:
    linear-gradient(45deg, rgba(148,163,184,0.18) 25%, transparent 25%),
    linear-gradient(-45deg, rgba(148,163,184,0.18) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, rgba(148,163,184,0.18) 75%),
    linear-gradient(-45deg, transparent 75%, rgba(148,163,184,0.18) 75%);
  background-position: 0 0, 0 8px, 8px -8px, -8px 0;
  background-size: 16px 16px;
}
.neko-gallery-label {
  min-width: 0;
  overflow: hidden;
  color: var(--muted);
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.neko-gallery-missing {
  display: grid;
  place-items: center;
  aspect-ratio: 1 / 1;
  color: var(--muted);
  border: 1px dashed var(--border);
  border-radius: var(--radius-md);
}
.neko-download {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
}
.neko-text-block {
  white-space: pre-wrap;
  line-height: 1.6;
  color: var(--text);
}
.neko-log-viewer {
  max-height: 280px;
  margin: 0;
  padding: 10px 12px;
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: rgba(15,23,42,0.08);
  color: var(--text);
  white-space: pre-wrap;
